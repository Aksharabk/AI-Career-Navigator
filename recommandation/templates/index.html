<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Career Recommendation | AI-POWERED CAREER GUIDANCE AND EMPLOYABILITY ENHANCEMENT PLATFORM</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  font-family: 'Segoe UI';
  background: linear-gradient(135deg, #667eea, #764ba2);
  margin: 0;
}

.container {
  width: 90%;
  max-width: 900px;
  margin: 60px auto;
  background: white;
  padding: 30px;
  border-radius: 20px;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

input, textarea {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 12px;
  background: #667eea;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

button:hover {
  background: #5a6fd8;
}
</style>
</head>

<body>

<div class="container">

<h2 style="font-size: 20px; text-transform: uppercase;"><i class="fa-solid fa-bullseye" style="color: #667eea; margin-right: 8px;"></i>AI-POWERED CAREER GUIDANCE AND EMPLOYABILITY ENHANCEMENT PLATFORM</h2>
<p style="text-align: center; color: #666; margin-bottom: 20px; font-size: 14px;">Personalized Skills & Career Matcher</p>

<form action="/recommend" method="POST">

<label>Skills:</label>
<input type="text" name="skills" placeholder="Ex: java, python, sql" required>

<label>Interests:</label>
<input type="text" placeholder="Ex: coding, design">

<label>Favourite Subject:</label>
<input type="text" placeholder="Ex: DBMS">

<button type="submit"><i class="fa-solid fa-wand-magic-sparkles" style="margin-right: 8px;"></i>Recommend Careers</button>

</form>

</div>

</body>
</html>
