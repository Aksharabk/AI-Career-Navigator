<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI-POWERED CAREER GUIDANCE AND EMPLOYABILITY ENHANCEMENT PLATFORM – Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#667eea,#764ba2);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.chat-wrapper{
  width:420px;
  height:85vh;
  background:#fff;
  border-radius:22px;
  display:flex;
  flex-direction:column;
  box-shadow:0 25px 60px rgba(0,0,0,.35);
  overflow:hidden;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:#fff;
  padding:18px;
  display:flex;
  align-items:center;
  gap:12px;
}
.header .icon{
  width:42px;height:42px;
  background:#fff;
  color:#667eea;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}
.header h3{margin:0;font-size:16px;}
.header span{font-size:12px;opacity:.9;}

/* CHAT AREA */
.chat-area{
  flex:1;
  padding:16px;
  background:#f4f6fb;
  overflow-y:auto;
}

.msg{
  max-width:85%;
  padding:12px 14px;
  margin-bottom:12px;
  border-radius:14px;
  font-size:14px;
  line-height:1.6;
}
.bot{
  background:#fff;
  color:#333;
  border-bottom-left-radius:0;
}
.user{
  background:#667eea;
  color:#fff;
  align-self:flex-end;
  border-bottom-right-radius:0;
}

/* QUICK OPTIONS */
.quick{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:12px;
}
.quick span{
  background:#eef2ff;
  color:#667eea;
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
  cursor:pointer;
}

/* INPUT */
.input{
  padding:12px;
  display:flex;
  gap:10px;
  border-top:1px solid #ddd;
}
.input input{
  flex:1;
  padding:10px;
  border-radius:20px;
  border:1px solid #ccc;
  outline:none;
}
.input button{
  width:42px;height:42px;
  border-radius:50%;
  background:#667eea;
  color:#fff;
  border:none;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="chat-wrapper">

<div class="header">
  <div class="icon"><i class="fa-solid fa-robot"></i></div>
  <div>
    <h3 style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.3px;">AI-POWERED CAREER GUIDANCE AND EMPLOYABILITY ENHANCEMENT PLATFORM</h3>
    <span>Career & Employability Assistant</span>
  </div>
</div>

<div class="chat-area" id="chat">
  <div class="msg bot">
    👋 Hi! I’m the <b>AI-Powered Career Guidance and Employability Enhancement Assistant</b>.<br><br>
    I can guide you on:
  </div>
  <div class="quick">
    <span onclick="quickAsk('career options')">Career Options</span>
    <span onclick="quickAsk('skills')">Skills</span>
    <span onclick="quickAsk('exams')">Competitive Exams</span>
    <span onclick="quickAsk('placements')">Placements</span>
    <span onclick="quickAsk('higher studies')">Higher Studies</span>
  </div>
</div>

<div class="input">
  <input id="userInput" placeholder="Ask your career doubt..." />
  <button onclick="send()"><i class="fa-solid fa-paper-plane"></i></button>
</div>

</div>

<script>
const chat=document.getElementById("chat");

function addMsg(text,cls){
  const d=document.createElement("div");
  d.className="msg "+cls;
  d.innerHTML=text;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}

function send(){
  const input=document.getElementById("userInput");
  const msg=input.value.trim();
  if(!msg) return;
  addMsg(msg,"user");
  input.value="";
  setTimeout(()=>addMsg(brain(msg),"bot"),500);
}

function quickAsk(q){
  addMsg(q,"user");
  setTimeout(()=>addMsg(brain(q),"bot"),400);
}

function brain(msg){
  msg=msg.toLowerCase();

  if(msg.includes("career")){
    return `🎯 Career selection depends on interests, skills, aptitude, and market demand.
    Use <b>IQ Test</b> and <b>Career Recommendation</b> modules for personalized results.`;
  }
  if(msg.includes("skill")){
    return `🛠️ Important skills:
    <ul><li>Programming (Java, Python)</li><li>Problem Solving</li><li>Communication</li><li>Logical Thinking</li></ul>`;
  }
  if(msg.includes("exam")||msg.includes("gate")||msg.includes("cat")){
    return `📚 Popular exams:
    <ul><li>GATE – Engineering</li><li>CAT – MBA</li><li>GRE – MS abroad</li><li>Govt Exams</li></ul>`;
  }
  if(msg.includes("placement")||msg.includes("job")){
    return `💼 Placement prep:
    <ul><li>DSA</li><li>Projects</li><li>Aptitude</li><li>Mock Interviews</li></ul>`;
  }
  if(msg.includes("higher")){
    return `🎓 Higher studies:
    <ul><li>M.Tech / MS</li><li>MBA</li><li>PhD</li></ul>`;
  }

  return `🤖 I’m specialized in career guidance.
  Please ask about careers, skills, exams, placements, or future planning.`;
}

document.getElementById("userInput").addEventListener("keypress",e=>{
  if(e.key==="Enter") send();
});
</script>

</body>
</html>
